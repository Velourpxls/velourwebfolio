<script>
// Enrutado por dispositivo. Un solo punto de entrada: index.html decide
// qué versión sirve y no vuelve a redirigir (replace, sin entrada de historial).
(function () {
  var qs = location.search;
  var forced = /[?&]v=(movil|escritorio)/.exec(qs);
  var target;

  if (forced) {
    target = forced[1] === "movil" ? "movil.dc.html" : "desktop.dc.html";
  } else {
    var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    var narrow = Math.min(screen.width, screen.height) <= 820;
    var touch = "ontouchstart" in window || navigator.maxTouchPoints > 1;
    var uaMobile = navigator.userAgentData
      ? navigator.userAgentData.mobile
      : /iphone|ipod|android.*mobile|windows phone/i.test(navigator.userAgent);
    // tablet/móvil: puntero grueso o pantalla estrecha con táctil
    target = (uaMobile || (coarse && narrow) || (touch && narrow)) ? "movil.dc.html" : "desktop.dc.html";
  }
  location.replace(target + qs.replace(/[?&]v=(movil|escritorio)/, "").replace(/^&/, "?") + location.hash);
})();
</script>
