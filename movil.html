<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velour — Productora audiovisual · Madrid</title>
<meta name="description" content="Velour es un colectivo de personas con visión artística, enfocadas en la producción de proyectos audiovisuales y con sede en Madrid.">
<link rel="icon" href="uploads/Isotipio_Blanco@2x.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:title" content="Velour — Productora audiovisual · Madrid">
<meta property="og:description" content="Documental, podcast, videoclip y fashion film. You are a pixel away from arête.">
<meta property="og:image" content="uploads/Isotipio_Blanco@2x.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
<script>
(function(){
  try {
    if (window.matchMedia('(min-width: 821px)').matches) {
      location.replace('index.html' + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
@font-face{font-family:'Schengen';src:url('uploads/ABCSchengenAVariable-Trial.ttf') format('truetype');font-weight:100 900;font-display:swap}
html,body{margin:0;background:#0a0a0a;font-family:'Schengen',sans-serif;font-weight:200;overscroll-behavior:none}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.ytwrap{position:absolute;inset:0;overflow:hidden;background:#0a0a0a}
.loop{position:relative;overflow:hidden;background:#141414;cursor:pointer}
.loop .vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px);font-size:9px;letter-spacing:.18em;color:#4a4a4a;text-align:center;padding:8px}
.loop .lp-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:rgba(8,8,8,.6);opacity:0;transition:opacity .35s ease;color:#f4f4f4;font-weight:200;z-index:3;font-size:12px}
.loop.presel .lp-name{opacity:1}
.langbtn{cursor:pointer;font-size:11px;letter-spacing:.14em;color:#9a9a9a;transition:color .25s}
.langbtn.on{color:#f4f4f4}
.herologo{transition:transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:auto;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.herologo.grown{transform:scale(1.12)}
.herologo.grown.push-up{transform:translateY(-16vh) scale(1)}
.florimg{mix-blend-mode:screen;transition:opacity .22s ease}
.florimg.off{opacity:0;pointer-events:none}
.soundbtn{cursor:pointer;font-size:11px;letter-spacing:.14em;color:#c9c9c9;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px;background:rgba(10,10,10,.32)}
.rv{opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;pointer-events:auto}
.rv-bot{transform:translateY(20px)}
.rv-bot.on{transform:translateY(0)}
.rvlabel{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#c0c0c0}
.carousel{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.carousel::-webkit-scrollbar{display:none}
.infobar a,.infobar span{white-space:nowrap}
.herologo.pixed{opacity:0}
.words{opacity:0;transition:opacity .5s ease .14s;pointer-events:none}
.words.on{opacity:1}
.words .navw{pointer-events:none}
.words.on .navw{pointer-events:auto}
.navw{font-size:19px;letter-spacing:.02em;color:#f0f0f0;cursor:pointer;transition:color .2s,letter-spacing .3s;padding:6px}
.navw.sel{color:#fff;letter-spacing:.1em;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.words.wglitch .navw{animation:wjit .07s steps(2,end) infinite}
@keyframes wjit{0%{transform:translate(0,0);opacity:1}25%{transform:translate(-7px,3px) skewX(9deg);opacity:.35}50%{transform:translate(6px,-4px);opacity:.9}75%{transform:translate(-4px,-2px) skewX(-7deg);opacity:.5}100%{transform:translate(4px,2px);opacity:1}}
</style>
</helmet>

<div style="background:#0a0a0a;color:#ededed;font-family:'Schengen',sans-serif;min-height:100vh">

  <!-- ============================= HOME móvil ============================= -->
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;width:min(100vw,430px);margin:0 auto;box-shadow:0 0 0 1px #1c1c1c">

    <div class="ytwrap"><div ref="{{ ytRef }}" style="position:absolute;inset:0"></div></div>
    <div ref="{{ overlayRef }}" onClick="{{ bgTap }}" style="position:absolute;inset:0;background:#0a0a0a;opacity:.28;transition:opacity .55s ease"></div>

    <!-- ABAJO: carrusel horizontal de proyectos -->
    <div class="rv rv-bot {{ workClass }}" style="position:absolute;left:0;right:0;bottom:76px;z-index:4;display:flex;flex-direction:column;gap:10px">
      <div class="rvlabel" style="padding:0 18px">Proyectos</div>
      <div class="carousel" ref="{{ scrollRef }}" style="display:flex;gap:12px;padding:8px 18px">
        <sc-for list="{{ tenProjects }}" as="p" hint-placeholder-count="0">
          <div class="loop {{ p.selCls }}" style="width:72vw;max-width:340px;aspect-ratio:16/9;flex:none;scroll-snap-align:center" onClick="{{ p.tap }}">
            <div class="vs">loop · {{ p.slot }}</div>
            <div ref="{{ p.frameRef }}" style="position:absolute;inset:0;background-size:cover;background-position:center"></div>
            <div class="lp-name">{{ p.name }}</div>
          </div>
        </sc-for>
      </div>
      <div class="rvlabel" style="padding:0 18px;color:#8a8a8a;letter-spacing:.18em">{{ tapHint }}</div>
    </div>

    <!-- EQUIPO (us) -->
    <div class="rv rv-bot {{ usClass }}" style="position:absolute;left:0;right:0;bottom:76px;z-index:4;display:flex;flex-direction:column;gap:10px">
      <div class="rvlabel" style="padding:0 18px">Team</div>
      <div class="carousel" style="display:flex;gap:14px;padding:8px 18px;align-items:flex-start">
        <sc-for list="{{ team }}" as="tm" hint-placeholder-count="0">
          <div style="flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;width:{{ tm.w }}">
            <div class="loop" ref="{{ tm.ref }}" style="width:100%;aspect-ratio:1/1;cursor:default;background-size:cover;background-position:center"></div>
            <div style="font-weight:500;font-size:11px;letter-spacing:.03em;color:#f6f6f6">{{ tm.name }}</div>
            <div style="font-weight:200;font-size:8.5px;line-height:1.5;letter-spacing:.09em;text-transform:uppercase;color:#9c9c9c;text-wrap:pretty">{{ tm.role }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- contacto bajo el logo -->
    <div class="rv rv-bot {{ contactClass }}" style="position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:4;text-align:center">
      <div class="rvlabel" style="margin-bottom:12px">Contact</div>
      <div class="infobar" style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <a href="mailto:info@velourpixel.com" style="font-size:17px;color:#f2f2f2">info@velourpixel.com</a>
        <span style="font-size:15px;color:#dcdcdc">+34 600 855 079</span>
        <a href="https://instagram.com/velourpixels" target="_blank" style="font-size:13px;letter-spacing:.1em;color:#c4c4c4">@velourpixels</a>
        <span style="font-size:13px;color:#9a9a9a">Madrid</span>
      </div>
    </div>

    <!-- about bajo el logo -->
    <div class="rv rv-bot {{ aboutClass }}" style="position:absolute;left:24px;right:24px;bottom:15%;z-index:4">
      <div class="rvlabel" style="margin-bottom:12px">About</div>
      <div style="font-size:16px;line-height:1.7;color:#dcdcdc;text-wrap:pretty">{{ aboutText }}</div>
    </div>

    <!-- logo centrado -->
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5">
      <div class="herologo {{ shiftClass }}" onClick="{{ revealOn }}">
        <img ref="{{ logoRef }}" src="uploads/Workdmark_Blanca@2x.png" alt="Logo" style="width:var(--logo,180px);height:auto;opacity:0">
        <img class="florimg {{ pixClass }}" ref="{{ florRef }}" src="uploads/Isotipio_Blanco@2x.png" alt="Logo inicial" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(30vw,130px);height:auto;filter:drop-shadow(0 2px 20px rgba(0,0,0,.6))">
      </div>
    </div>

    <canvas ref="{{ pixRef }}" style="position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none"></canvas>

    <!-- palabras flotantes -->
    <div class="words {{ onClass }} {{ wGlitchClass }}" style="position:absolute;inset:0;z-index:6">
      <sc-for list="{{ navWords }}" as="nw" hint-placeholder-count="0">
        <span class="navw {{ nw.selClass }}" ref="{{ nw.wref }}" onClick="{{ nw.click }}" style="position:absolute">{{ nw.label }}</span>
      </sc-for>
    </div>

    <div class="rv {{ onClass }}" style="position:absolute;top:18px;left:16px;z-index:6">
      <span class="soundbtn" onClick="{{ goBack }}">← {{ back }}</span>
    </div>
    <div style="position:absolute;bottom:18px;left:16px;z-index:6">
      <span class="soundbtn" onClick="{{ toggleSound }}">◗ {{ soundLabel }}</span>
    </div>
    <div style="position:absolute;top:22px;right:16px;display:flex;gap:12px;align-items:center;z-index:6">
      <span class="langbtn {{ esClass }}" onClick="{{ setEs }}">ES</span>
      <span style="color:#3a3a3a">/</span>
      <span class="langbtn {{ enClass }}" onClick="{{ setEn }}">EN</span>
    </div>

  </div>
  </sc-if>

  <!-- ============================= FICHA móvil ============================= -->
  <sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
  <div style="min-height:100vh;width:min(100vw,430px);margin:0 auto;box-shadow:0 0 0 1px #1c1c1c;position:relative">
    <div style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none">
      <div ref="{{ fichaBgRef }}" style="position:absolute;inset:0;filter:blur(24px) saturate(1.1) brightness(.5);transform:scale(1.14)"></div>
      <div style="position:absolute;inset:0;background:rgba(8,8,8,.42)"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 18px;position:relative;z-index:1">
      <div class="langbtn on" onClick="{{ goHome }}">← {{ back }}</div>
      <img src="uploads/Workdmark_Blanca@2x.png" alt="Logo" style="height:16px;width:auto;opacity:.92">
    </div>
    <div style="padding:4px 18px 40px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1">
      <div class="loop" ref="{{ mainVideoRef }}" style="aspect-ratio:16/9;cursor:default;background:#000">
      </div>
      <div>
        <div style="font-size:24px;font-weight:300;letter-spacing:-.01em;color:#f4f4f4">{{ curTitle }}</div>
        <div style="font-size:15px;line-height:1.65;color:#a8a8a8;margin-top:10px;text-wrap:pretty;white-space:pre-line">{{ curSummary }}</div>
      </div>
      <sc-if value="{{ showFrames }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <sc-for list="{{ fichaFrames }}" as="f" hint-placeholder-count="6">
          <div ref="{{ f.ref }}" style="aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:opacity .5s ease"></div>
        </sc-for>
      </div>
      </sc-if>
    </div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;heroLogoSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:180,&quot;min&quot;:100,&quot;max&quot;:260,&quot;step&quot;:5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ajustes&quot;,&quot;label&quot;:&quot;Ancho del logo en portada&quot;}}">
class Component extends DCLogic {
  state = { lang: "es", view: "home", proj: 0, muted: true, revealed: false, panel: null, navMode: "main", cat: null, wGlitch: false, preSel: null };
  w = [];
  wref = (i) => (el) => { this.w[i] = el; };
  glitchSwap = (patch) => {
    this.setState({ wGlitch: true });
    clearTimeout(this._gs1); clearTimeout(this._gs2); clearInterval(this._scr);
    const chars = "▙▚▛▜▝■□▪#/\\|<>_-=+*";
    this._scr = setInterval(() => {
      (this.w || []).forEach((el) => {
        if (!el || !el.isConnected) return;
        el.textContent = (el.textContent || "").split("").map((ch) =>
          ch === " " ? ch : (Math.random() < 0.45 ? chars[Math.floor(Math.random() * chars.length)] : ch)).join("");
      });
    }, 40);
    this._gs1 = setTimeout(() => { this.setState(patch); this.generateRects(patch.navMode === "work" ? 5 : 4); }, 220);
    this._gs2 = setTimeout(() => {
      clearInterval(this._scr);
      const labels = this.navLabels(patch.navMode || this.state.navMode);
      (this.w || []).forEach((el, i) => { if (el && el.isConnected && labels[i] !== undefined) el.textContent = labels[i]; });
      this.setState({ wGlitch: false });
    }, 560);
  };

  setOverlay = (el) => { if (el) this.overlay = el; };
  pixRef = (el) => { this.pix = el; };
  logoRef = (el) => { this.logoEl = el; };
  florRef = (el) => { this.florEl = el; };
  scrollRef = (el) => { this.scrollEl = el; };

  // overlay de carga: el isotipo se forma a partir de píxeles con ruido
  addLoader = (el) => {
    let c = el.querySelector("canvas.loadcv");
    if (!c) {
      c = document.createElement("canvas");
      c.className = "loadcv"; c.width = 192; c.height = 108;
      c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;z-index:2;image-rendering:pixelated;transition:opacity .5s ease;background:#101010";
      el.appendChild(c);
    }
    c.style.opacity = "1"; c._t0 = 0; c._seed = Math.random() * 997;
    c._dur = 320 + Math.random() * 260;
    c._spread = 0.5 + Math.random() * 1.4;
    c._stagger = 0.2 + Math.random() * 0.4;
  };
  revealTile = (el) => {
    if ((this.state.panel !== "work" && this.state.panel !== "us") || !this.state.revealed) { this.removeLoader(el); return; }
    if (!this.introPend) this.introPend = [];
    if (this.introPend.indexOf(el) === -1) this.introPend.push(el);
  };
  removeLoader = (el) => {
    const c = el.querySelector("canvas.loadcv");
    if (!c) return;
    c.style.opacity = "0";
    setTimeout(() => c.remove(), 600);
  };
  // al abrir "us", cada foto se forma de nuevo con su línea
  armTeam = () => {
    (this.teamEls || []).forEach((el) => {
      if (!el || !el.isConnected) return;
      this.addLoader(el);
      setTimeout(() => this.revealTile(el), 120 + Math.random() * 420);
    });
  };
  teamRef = (i, src) => (el) => {
    if (!this.teamEls) this.teamEls = [];
    this.teamEls[i] = el;
    if (el && el._src !== src) { el._src = src; el.style.backgroundImage = 'url("' + src + '?v=3")'; }
  };

  // fondo de la ficha: mismo showreel, desenfocado por CSS del contenedor
  fichaBgRef = (el) => {
    if (!el || el.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.src = "https://player.vimeo.com/video/1212324961?h=c216465273&background=1&autoplay=1&loop=1&muted=1&autopause=0";
    f.allow = "autoplay";
    f.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:178vh;height:100vh;min-width:100vw;min-height:56.25vw;pointer-events:none;border:0";
    el.appendChild(f);
  };

  // frames del vídeo del proyecto en la ficha (rotan con fundido)
  // recorte del embed de Instagram: solo la banda del vídeo (sin cabecera ni pie)
  igFrame = (code, cell) => {
    const IW = 400, BAND_TOP = 58, BAND_H = 500;
    const f = document.createElement("iframe");
    f.src = "https://www.instagram.com/reel/" + code + "/embed/";
    f.loading = "lazy";
    f.scrolling = "no";
    f.style.cssText = "position:absolute;top:0;left:0;width:" + IW + "px;height:900px;border:0;pointer-events:none;background:#131313;transform-origin:0 0";
    const fit = () => {
      if (!cell.isConnected) return;
      const w = cell.clientWidth, h = cell.clientHeight;
      if (!w || !h) return;
      const s = Math.max(w / IW, h / BAND_H);
      const tx = w / 2 - (IW / 2) * s;
      const ty = h / 2 - (BAND_TOP + BAND_H / 2) * s;
      f.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
    };
    requestAnimationFrame(fit);
    if (window.ResizeObserver) { const ro = new ResizeObserver(fit); ro.observe(cell); }
    return f;
  };

  // composición de tres verticales de Instagram (tarjeta y ficha)
  igTrio = (posts, opts) => {
    const o = opts || {};
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:" + (o.gap || 7) + "px;background:#0b0b0b;z-index:1";
    posts.forEach((code, k) => {
      const cell = document.createElement("div");
      cell.style.cssText = "height:calc(100% - " + (o.inset || 12) + "px);aspect-ratio:9/16;flex:none;position:relative;overflow:hidden;background:#131313;border:.5px solid rgba(255,255,255,.85)";
      const f = this.igFrame(code, cell);
      if (k === 0 && o.onFirstLoad) f.addEventListener("load", o.onFirstLoad);
      const link = document.createElement("a");
      link.href = "https://www.instagram.com/reel/" + code + "/";
      link.target = "_blank"; link.rel = "noopener";
      link.style.cssText = "position:absolute;inset:0;z-index:2";
      cell.appendChild(f); cell.appendChild(link);
      wrap.appendChild(cell);
    });
    return wrap;
  };

  // descripción real del vídeo en Vimeo (oEmbed)
  fetchDesc = (v) => {
    if (!v || v.yt) return;
    if (!this.descReq) this.descReq = {};
    if (this.descReq[v.id]) return;
    this.descReq[v.id] = true;
    const url = "https://vimeo.com/" + v.id + (v.h ? "/" + v.h : "");
    fetch("https://vimeo.com/api/oembed.json?url=" + encodeURIComponent(url))
      .then((r) => r.json())
      .then((j) => {
        const d = (j.description || "").trim();
        if (d) this.setState((s) => ({ descs: { ...(s.descs || {}), [v.id]: d } }));
      })
      .catch(() => {});
  };

  // los frames heredan la proporción real del vídeo principal
  applyFrameAR = () => {
    const ar = this._vidAR || "16 / 9";
    (this.fEls || []).forEach((el) => { if (el && el.isConnected) el.style.aspectRatio = ar; });
  };
  fRef = (i) => (el) => {
    if (!this.fEls) this.fEls = [];
    this.fEls[i] = el;
    if (el) { requestAnimationFrame(this.applyFrameAR); this.buildFrame(el, i); }
  };
  buildFrame = (el, i) => {
    if (!el || !el.isConnected) return;
    const v = (this._projList || [])[this.state.proj]?.vid;
    const key = v ? (v.yt || v.id) : "none";
    if (el._fkey !== key) { el._fkey = key; el.innerHTML = ""; el._vp = null; el._dur = null; el._url = null; }
    if (!v) return;
    if (v.yt) {
      const idx = ((i + (el._tick || 0)) % 3) + 1;
      const url = "https://i.ytimg.com/vi/" + v.yt + "/mq" + idx + ".jpg";
      if (el._url !== url) {
        el._url = url;
        el.style.opacity = "0";
        const im = new Image();
        im.onload = () => { if (el._url === url) { el.style.backgroundImage = 'url("' + url + '")'; el.style.opacity = "1"; } };
        im.src = url;
      }
      return;
    }
    el.style.backgroundImage = "";
    if (!el.querySelector("iframe")) {
      const f = document.createElement("iframe");
      f.src = "https://player.vimeo.com/video/" + v.id + "?" + (v.h ? "h=" + v.h + "&" : "") + "background=1&autoplay=1&loop=1&muted=1&autopause=0";
      f.allow = "autoplay";
      // sangrado de 2px: la costura clara del player queda fuera del recorte
      f.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(178% + 2px);height:calc(178% + 2px);pointer-events:none;border:0;background:#000";
      el.style.background = "#000";
      el.appendChild(f);
      const arm = () => {
        if (!f.isConnected) return;
        if (!(window.Vimeo && window.Vimeo.Player)) { setTimeout(arm, 200); return; }
        if (el._vp) return;
        el._vp = new Vimeo.Player(f);
        el._vp.getDuration().then((d) => { el._dur = d; this.seekFrame(el, i); }).catch(() => {});
      };
      f.addEventListener("load", arm);
      arm();
    } else if (el._vp && el._dur) this.seekFrame(el, i);
  };
  seekFrame = (el, i) => {
    if (!el._vp || !el._dur) return;
    const frac = ((i * 0.083) + (el._tick || 0) * 0.137) % 1;
    const t = Math.max(0.2, Math.min(el._dur - 0.3, frac * el._dur));
    el.style.opacity = "0";
    el._vp.setCurrentTime(t)
      .then(() => el._vp.pause())
      .then(() => setTimeout(() => { el.style.opacity = "1"; }, 150))
      .catch(() => { el.style.opacity = "1"; });
  };

  hideRectEls = () => { (this._rectEls || []).forEach((d) => { d.style.display = "none"; }); };
  rand = (a, b) => a + Math.random() * (b - a);
  generateRects = (n) => {

      onClass: this.state.revealed ? "on" : "",
      shiftClass: this.state.revealed ? ("grown" + (this.state.panel ? " push-up" : "")) : "",
      florRef: this.florRef,
      pixClass: this.state.revealed ? "off" : "",
      workClass: this.state.panel === "work" ? "on" : "",
      contactClass: this.state.panel === "contact" ? "on" : "",
      aboutClass: this.state.panel === "about" ? "on" : "",
      tapHint: this.state.preSel !== null
        ? (lang === "es" ? "toca de nuevo para abrir" : "tap again to open")
        : (lang === "es" ? "toca un proyecto para seleccionarlo" : "tap a project to select it"),
      aboutText: lang === "es"
        ? "Somos Velour, una productora audiovisual. Texto breve que explica quiénes somos, qué hacemos y cómo trabajamos — sin ruido."
        : "We are Velour, an audiovisual production company. A short line about who we are, what we do and how we work — no noise.",
      pixRef: this.pixRef,
      scrollRef: this.scrollRef,
      logoRef: this.logoRef,
      curSlot: projects[this.state.proj]?.slot || "",
      mainVideoRef: (el) => {
        if (!el) return;
        const v = projects[this.state.proj]?.vid;
        this.fetchDesc(v);
        // social media: la ficha muestra los tres verticales
        if (v && v.igPosts) {
          if (el._igxFicha !== v.id) {
            el._igxFicha = v.id;
            el.innerHTML = "";
            el.style.backgroundImage = "";
            el.style.aspectRatio = "16 / 9";
            el.appendChild(this.igTrio(v.igPosts, { gap: 8, inset: 0 }));
          }
          return;
        }
        if (el._igxFicha) { el._igxFicha = null; el.innerHTML = ""; }
        const f = el.querySelector("iframe");
        if (v) {
          const want = v.yt
            ? "https://www.youtube-nocookie.com/embed/" + v.yt + "?rel=0&playsinline=1&modestbranding=1"
            : "https://player.vimeo.com/video/" + v.id + "?" + (v.h ? "h=" + v.h + "&" : "");
          if (f && f.src !== want) f.remove();
          // portada de YouTube bajo el player: si el embed se bloquea, sigue viéndose el proyecto
          if (v.yt) {
            if (el._ytPoster !== v.yt) {
              el._ytPoster = v.yt;
              el.style.backgroundImage = 'url("https://i.ytimg.com/vi/' + v.yt + '/maxresdefault.jpg"),url("https://i.ytimg.com/vi/' + v.yt + '/hqdefault.jpg")';
              el.style.backgroundSize = "cover";
              el.style.backgroundPosition = "center";
              let fb = el.querySelector("a.ytfb");
              if (!fb) {
                fb = document.createElement("a");
                fb.className = "ytfb";
                fb.target = "_blank"; fb.rel = "noopener";
                fb.style.cssText = "position:absolute;inset:auto 0 0 0;z-index:0;display:flex;align-items:center;justify-content:center;padding:10px;font-family:'Schengen',sans-serif;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#cfcfcf;background:linear-gradient(to top,rgba(0,0,0,.78),transparent)";
                el.appendChild(fb);
              }
              fb.href = "https://www.youtube.com/watch?v=" + v.yt;
              fb.textContent = "ver en youtube";
            }
          } else if (el._ytPoster) {
            el._ytPoster = null;
            el.style.backgroundImage = "";
            const old = el.querySelector("a.ytfb");
            if (old) old.remove();
          }
          if (!el.querySelector("iframe")) {
            const nf = document.createElement("iframe");
            nf.src = want; nf.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
            nf.allowFullscreen = true;
            nf.referrerPolicy = "strict-origin-when-cross-origin";
            nf.style.cssText = "position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);border:0;z-index:1";
            if (!v.yt) nf.style.background = "#000";
            el.appendChild(nf);
          }
          // la portada adopta la proporción REAL del vídeo: sin barras nunca
          const key = v.yt || v.id;
          if (el._arKey !== key) {
            el._arKey = key;
            if (v.yt) { el.style.aspectRatio = "16 / 9"; el.style.width = ""; this._vidAR = "16 / 9"; this.applyFrameAR(); }
            else {
              let tries = 0;
              const probe = () => {
                if (!el.isConnected || el._arKey !== key || tries++ > 40) return;
                if (!(window.Vimeo && window.Vimeo.Player)) { setTimeout(probe, 250); return; }
                const fr = el.querySelector("iframe");
                if (!fr) return;
                if (!fr._mvp) fr._mvp = new Vimeo.Player(fr);
                Promise.all([fr._mvp.getVideoWidth(), fr._mvp.getVideoHeight()])
                  .then(([vw, vh]) => {
                    if (vw && vh) {
                      el.style.aspectRatio = vw + " / " + vh;
                      // un vertical nunca desborda la pantalla del teléfono
                      el.style.width = "min(100%, calc(62vh * " + (vw / vh).toFixed(4) + "))";
                      el.style.marginInline = "auto";
                      this._vidAR = vw + " / " + vh;
                      this.applyFrameAR();
                    } else setTimeout(probe, 300);
                  })
                  .catch(() => setTimeout(probe, 300));
              };
              probe();
            }
          }
        } else if (f) f.remove();
      },
      showFrames: projects[this.state.proj]?.cat !== "podcast" && !projects[this.state.proj]?.vid?.igPosts,
      curTitle: projects[this.state.proj]?.title || "",
      curSummary: projects[this.state.proj]?.summary || "",
      esClass: lang === "es" ? "on" : "",
      enClass: lang === "en" ? "on" : "",
      back: lang === "es" ? "volver" : "back",
      goBack: this.goBack,
      bgTap: this.bgTap,
      ytRef: this.ytRef,
      overlayRef: this.setOverlay,
      revealOn: this.revealOn,
      toggleSound: this.toggleSound,
      soundLabel: (this.state.muted
        ? (lang === "es" ? "sonido ✕" : "sound off")
        : (lang === "es" ? "sonido ●" : "sound on")),
      setEs: () => this.setState({ lang: "es" }),
      setEn: () => this.setState({ lang: "en" }),
      goHome: () => this.setState({ view: "home", preSel: null }),
    };
  }
}
</script>
</body>
</html>
