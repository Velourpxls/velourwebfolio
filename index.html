<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velour — Productora audiovisual · Madrid</title>
<meta name="description" content="Velour es un colectivo de personas con visión artística, enfocadas en la producción de proyectos audiovisuales y con sede en Madrid.">
<link rel="icon" href="uploads/Isotipio_Blanco@2x.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:title" content="Velour — Productora audiovisual · Madrid">
<meta property="og:description" content="Documental, podcast, videoclip y fashion film. You are a pixel away from arête.">
<meta property="og:image" content="uploads/Isotipio_Blanco@2x.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
<script>
(function(){
  try {
    if (window.matchMedia('(max-width: 820px)').matches) {
      location.replace('movil.html' + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Schengen';src:url('uploads/ABCSchengenAVariable-Trial.ttf') format('truetype');font-weight:100 900;font-display:swap}
html,body{margin:0;background:#0a0a0a;font-family:'Schengen',sans-serif;font-weight:200}
.ytwrap{position:absolute;inset:0;overflow:hidden;background:#0a0a0a}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.loop{position:relative;overflow:hidden;background:#141414;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease}
.tl-left:hover{transform:translateX(18px) scale(1.05);z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tl-right:hover{transform:translateX(-18px) scale(1.05);z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.loop .vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px);font-family:'Schengen',sans-serif;font-size:9px;letter-spacing:.18em;color:#4a4a4a;text-align:center;padding:8px}
.loop .lp-loop{position:absolute;top:8px;right:9px;font-size:9px;color:#6a6a6a;letter-spacing:.14em;font-family:'Schengen',sans-serif;z-index:2}
.loop .lp-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:rgba(8,8,8,.6);opacity:0;transition:opacity .35s ease;color:#f4f4f4;font-family:'Schengen',sans-serif;font-weight:200;z-index:3}
.loop:hover .lp-name{opacity:1}
.langbtn{cursor:pointer;font-family:'Schengen',sans-serif;font-size:11px;letter-spacing:.14em;color:#9a9a9a;transition:color .25s}
.langbtn.on{color:#f4f4f4}
.herologo{transition:transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:auto;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.herologo:hover{transform:scale(1.07)}
.herologo.grown,.herologo.grown:hover{transform:scale(1.6)}
.herologo.grown.push-right,.herologo.grown.push-right:hover{transform:translateX(min(17vw,270px)) scale(1.15)}
.herologo.grown.push-left,.herologo.grown.push-left:hover{transform:translateX(max(-27vw,-400px)) scale(1)}
.herologo.grown.push-up,.herologo.grown.push-up:hover{transform:translateY(min(-9vh,-60px)) scale(1.3)}
.florimg{mix-blend-mode:screen;transition:opacity .22s ease}
.florimg.off{opacity:0;pointer-events:none}
.soundbtn{cursor:pointer;font-family:'Schengen',sans-serif;font-size:11px;letter-spacing:.14em;color:#c9c9c9;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px;background:rgba(10,10,10,.32);transition:border-color .25s,color .25s}
.soundbtn:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.rv{opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;pointer-events:auto}
.rv-left{transform:translateX(-34px)}
.rv-left.on{transform:translateX(26px)}
.rv-right{transform:translateX(34px)}
.rv-right.on{transform:translateX(-26px)}
.rv-bot{transform:translateY(20px)}
.rv-bot.on{transform:translateY(0)}
.rv-top{transform:translateY(-24px)}
.rv-top.on{transform:translateY(0)}
.topscroll{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.topscroll::-webkit-scrollbar{display:none}
.herologo.grown.push-down,.herologo.grown.push-down:hover{transform:translateY(min(13vh,105px)) scale(1.1)}
.rvlabel{font-family:'Schengen',sans-serif;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#c0c0c0}
.leftscroll{overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.leftscroll::-webkit-scrollbar{display:none}
.noscroll{overflow-y:auto;scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.infobar a,.infobar span{white-space:nowrap}
.herologo.pixed{opacity:0}
.words{opacity:0;transition:opacity .5s ease .14s;pointer-events:none}
.words.on{opacity:1}
.words .navw{pointer-events:none}
.words.on .navw{pointer-events:auto}
.navw{font-family:'Schengen',sans-serif;font-size:calc(21px * var(--uis,1));letter-spacing:.08em;text-transform:uppercase;color:#f0f0f0;cursor:pointer;transition:color .2s,letter-spacing .3s,box-shadow .3s,background .3s;padding:5px 9px}
.navw:hover{color:#fff;letter-spacing:.16em}
.navw.sel{letter-spacing:.16em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95);backdrop-filter:invert(1);-webkit-backdrop-filter:invert(1);color:#111}
.navw{position:relative}
.words.wglitch .navw{animation:wjit .07s steps(2,end) infinite}
@keyframes wjit{0%{transform:translate(0,0);opacity:1}25%{transform:translate(-7px,3px) skewX(9deg);opacity:.35}50%{transform:translate(6px,-4px);opacity:.9}75%{transform:translate(-4px,-2px) skewX(-7deg);opacity:.5}100%{transform:translate(4px,2px);opacity:1}}
</style>
</helmet>

<div style="background:#0a0a0a;color:#ededed;font-family:'Schengen',sans-serif;min-height:100vh">

  <!-- ============================= HOME (pantalla única) ============================= -->
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <div onMouseLeave="{{ revealOff }}" style="position:relative;height:100vh;min-height:620px;overflow:hidden">

    <!-- vídeo showreel (Vimeo, fondo cover) -->
    <div class="ytwrap"><div ref="{{ ytRef }}" style="position:absolute;inset:0"></div></div>
    <div ref="{{ overlayRef }}" onClick="{{ revealOff }}" style="position:absolute;inset:0;background:#0a0a0a;opacity:.28;transition:opacity .55s ease"></div>

    <!-- IZQUIERDA: 6 vídeos -->
    <div style="position:absolute;left:160px;top:68px;bottom:150px;display:flex;align-items:stretch;z-index:4">
      <div class="rv rv-left {{ workClass }}" style="display:flex;flex-direction:column;gap:10px;width:auto;height:100%">
        <div class="rvlabel">Proyectos</div>
        <div class="leftscroll" ref="{{ scrollRef }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:12px;flex:1;min-height:0;padding:2px 26px 2px 2px">
          <sc-for list="{{ tenProjects }}" as="p" hint-placeholder-count="0">
            <div class="loop tl-left" style="width:min(44vw,540px);max-width:calc((100vh - 190px) / 4 * 16 / 9 - 21px);aspect-ratio:16/9;flex:none" onClick="{{ p.open }}" onMouseEnter="{{ tileOver }}" onMouseLeave="{{ tileOut }}">
              <div class="vs">loop · {{ p.slot }}</div>
              <div ref="{{ p.frameRef }}" style="position:absolute;inset:0;background-size:cover;background-position:center"></div>
              <div class="lp-loop">↻</div>
              <div class="lp-name" style="font-size:12px">{{ p.name }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- ARRIBA: equipo (us) -->
    <div class="rv rv-top {{ usClass }}" style="position:absolute;left:120px;right:120px;top:52px;z-index:4;display:flex;flex-direction:column;gap:10px;align-items:center">
      <div class="rvlabel" style="align-self:flex-start">Team</div>
      <div class="topscroll" style="padding:2px 6px 10px;width:100%">
      <div style="display:flex;gap:18px;align-items:flex-start;width:max-content;margin:0 auto">
        <sc-for list="{{ team }}" as="tm" hint-placeholder-count="0">
          <div style="flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;width:{{ tm.w }}">
            <div class="loop" ref="{{ tm.ref }}" style="width:100%;aspect-ratio:1/1;cursor:default;background-size:cover;background-position:center"></div>
            <div style="font-family:'Schengen',sans-serif;font-weight:500;font-size:13px;letter-spacing:.04em;color:#f6f6f6">{{ tm.name }}</div>
            <div style="font-family:'Schengen',sans-serif;font-weight:200;font-size:10.5px;line-height:1.5;letter-spacing:.09em;text-transform:uppercase;color:#9c9c9c;text-wrap:pretty">{{ tm.role }}</div>
          </div>
        </sc-for>
      </div>
      </div>
    </div>

    <!-- ABAJO: contacto desplegado bajo el logo -->
    <div class="rv rv-bot {{ contactClass }}" style="position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:4;text-align:center">
      <div class="rvlabel" style="margin-bottom:12px">Contact</div>
      <div class="infobar" style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <a href="mailto:info@velourpixel.com" style="font-size:17px;color:#f2f2f2">info@velourpixel.com</a>
        <span style="font-size:15px;color:#dcdcdc">+34 600 855 079</span>
        <a href="https://instagram.com/velourpixels" target="_blank" style="font-size:13px;letter-spacing:.1em;color:#c4c4c4">@velourpixels</a>
        <span style="font-size:13px;color:#9a9a9a">Madrid</span>
      </div>
    </div>

    <!-- logo centrado (hover = revela) -->
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5">
      <div class="herologo {{ shiftClass }}" onMouseEnter="{{ hoverDark }}" onMouseLeave="{{ hoverLight }}" onClick="{{ revealOn }}">
        <img ref="{{ logoRef }}" src="uploads/Workdmark_Blanca@2x.png" alt="Logo" style="width:var(--logo,200px);height:auto;opacity:0">
        <img class="florimg {{ pixClass }}" ref="{{ florRef }}" src="uploads/Isotipio_Blanco@2x.png" alt="Logo inicial" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(min(15vw,160px) * var(--uis,1));height:auto;filter:drop-shadow(0 2px 20px rgba(0,0,0,.6))">
      </div>
    </div>

    <!-- capa de pixelado + rectángulos + líneas -->
    <canvas ref="{{ pixRef }}" style="position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none"></canvas>

    <!-- DERECHA: texto about -->
    <div style="position:absolute;right:8vw;left:47vw;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;z-index:4;pointer-events:none">
      <div class="rv rv-right {{ aboutClass }}" style="pointer-events:auto;width:min(100%,620px);max-height:calc(100vh - 88px);display:flex;flex-direction:column;min-height:0">
        <div class="rvlabel" style="margin-bottom:12px;flex:none">About</div>
        <div class="noscroll" style="font-size:clamp(12.5px,1.35vh,15px);line-height:1.7;color:#dcdcdc;text-wrap:pretty;white-space:pre-line;min-height:0;flex:1 1 auto">{{ aboutText }}</div>
      </div>
    </div>

    <!-- palabras destino de las líneas -->
    <div class="words {{ onClass }} {{ wGlitchClass }}" style="position:absolute;inset:0;z-index:6">
      <sc-for list="{{ navWords }}" as="nw" hint-placeholder-count="0">
        <span class="navw {{ nw.selClass }}" ref="{{ nw.wref }}" onClick="{{ nw.click }}" style="position:absolute">{{ nw.label }}</span>
      </sc-for>
    </div>

    <!-- volver -->
    <div class="rv {{ onClass }}" style="position:absolute;top:24px;left:30px;z-index:6">
      <span class="soundbtn" onClick="{{ goBack }}">← {{ back }}</span>
    </div>
    <!-- sonido -->
    <div style="position:absolute;bottom:24px;left:30px;z-index:6">
      <span class="soundbtn" onClick="{{ toggleSound }}">◗ {{ soundLabel }}</span>
    </div>
    <!-- ES / EN -->
    <div style="position:absolute;top:26px;right:30px;display:flex;gap:14px;align-items:center;z-index:6">
      <span class="langbtn {{ esClass }}" onClick="{{ setEs }}">ES</span>
      <span style="color:#3a3a3a">/</span>
      <span class="langbtn {{ enClass }}" onClick="{{ setEn }}">EN</span>
    </div>

  </div>
  </sc-if>

  <!-- ============================= FICHA DE PROYECTO ============================= -->
  <sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
  <div style="height:100vh;position:relative;display:flex;flex-direction:column;overflow:hidden">
    <div style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none">
      <div ref="{{ fichaBgRef }}" style="position:absolute;inset:0;filter:blur(26px) saturate(1.1) brightness(.5);transform:scale(1.12)"></div>
      <div style="position:absolute;inset:0;background:rgba(8,8,8,.38)"></div>
    </div>
    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:20px 46px 14px;position:relative;z-index:1">
      <div class="langbtn on" onClick="{{ goHome }}">← {{ back }}</div>
      <img src="uploads/Workdmark_Blanca@2x.png" alt="Logo" style="height:18px;width:auto;opacity:.92">
    </div>
    <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:18px;padding:10px 46px 28px;position:relative;z-index:1;width:fit-content;max-width:100%;margin:0 auto">
      <div style="flex:none;display:flex;align-items:stretch;gap:12px;width:fit-content">
        <div class="loop" ref="{{ mainVideoRef }}" style="flex:none;aspect-ratio:16/9;align-self:center;cursor:default;background:#000">
        </div>
        <sc-if value="{{ showFrames }}" hint-placeholder-val="{{ true }}">
        <div ref="{{ framesWrapRef }}" style="flex:none;width:clamp(230px,23vw,340px);display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;align-content:center;gap:8px;overflow:hidden">
          <sc-for list="{{ fichaFrames }}" as="f" hint-placeholder-count="4">
            <div ref="{{ f.ref }}" style="aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:opacity .5s ease"></div>
          </sc-for>
        </div>
        </sc-if>
      </div>
      <div ref="{{ textRowRef }}" style="flex:none;display:flex;align-items:flex-end;gap:36px;width:0;min-width:100%">
        <div style="flex:1 1 auto;min-width:0">
          <div style="font-size:clamp(22px,2.4vw,32px);font-weight:300;letter-spacing:-.01em;color:#f4f4f4;line-height:1.15">{{ curTitle }}</div>
          <div class="noscroll" style="font-size:clamp(13px,1.45vh,15.5px);line-height:1.6;color:#a8a8a8;margin-top:10px;text-wrap:pretty;white-space:pre-line;max-width:80ch;max-height:22vh">{{ curSummary }}</div>
        </div>
        <div style="flex:none;font-family:'Schengen',sans-serif;font-size:9px;letter-spacing:.2em;color:#4a4a4a;padding-bottom:4px">{{ lang }}</div>
      </div>
    </div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;carouselSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:22,&quot;min&quot;:10,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ajustes&quot;,&quot;label&quot;:&quot;Velocidad del carrusel de frames&quot;},&quot;heroLogoSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:280,&quot;min&quot;:120,&quot;max&quot;:360,&quot;step&quot;:5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ajustes&quot;,&quot;label&quot;:&quot;Ancho del logo en portada&quot;}}">
class Component extends DCLogic {
  state = { lang: "es", view: "home", proj: 0, muted: true, revealed: false, panel: null, navMode: "main", cat: null, wGlitch: false };
  w = [];
  wref = (i) => (el) => { this.w[i] = el; };
  glitchSwap = (patch) => {
    this.setState({ wGlitch: true });
    clearTimeout(this._gs1); clearTimeout(this._gs2); clearInterval(this._scr);
    const chars = "▙▚▛▜▝■□▪#/\\|<>_-=+*";
    this._scr = setInterval(() => {  // scramble de caracteres durante el morph
      (this.w || []).forEach((el) => {
        if (!el || !el.isConnected) return;
        el.textContent = (el.textContent || "").split("").map((ch) =>
          ch === " " ? ch : (Math.random() < 0.45 ? chars[Math.floor(Math.random() * chars.length)] : ch)).join("");
      });
    }, 40);
    this._gs1 = setTimeout(() => { this.setState(patch); this.generateRects(patch.navMode === "work" ? 5 : 4); }, 220);
    this._gs2 = setTimeout(() => {
      clearInterval(this._scr);
      // restaura las etiquetas finales directamente en el DOM (React no re-escribe nodos de texto iguales)
      const labels = this.navLabels(patch.navMode || this.state.navMode);
      (this.w || []).forEach((el, i) => { if (el && el.isConnected && labels[i] !== undefined) el.textContent = labels[i]; });
      this.setState({ wGlitch: false });
    }, 560);
  };

  setOverlay = (el) => { if (el) this.overlay = el; };
  pixRef = (el) => { this.pix = el; };
  logoRef = (el) => { this.logoEl = el; };
  florRef = (el) => { this.florEl = el; };
  scrollRef = (el) => { this.scrollEl = el; };


  // overlay de carga: logo formándose a partir de píxeles con ruido
  addLoader = (el) => {
    let c = el.querySelector("canvas.loadcv");
    if (!c) {
      c = document.createElement("canvas");
      c.className = "loadcv"; c.width = 192; c.height = 108;
      c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;z-index:2;image-rendering:pixelated;transition:opacity .5s ease;background:#101010";
      el.appendChild(c);
    }
    c.style.opacity = "1"; c._t0 = 0; c._seed = Math.random() * 997;
    c._dur = 320 + Math.random() * 260;         // formación muy rápida
    c._spread = 0.5 + Math.random() * 1.4;      // dispersión inicial distinta
    c._stagger = 0.2 + Math.random() * 0.4;     // escalonado de la llegada de píxeles
    c._spinDir = Math.random() < 0.5 ? -1 : 1;  // sentido del spinner
  };
  // el vídeo ya cargó: entra en cola para su animación de aparición (línea + rectángulo)
  revealTile = (el) => {
    if ((this.state.panel !== "work" && this.state.panel !== "us") || !this.state.revealed) { this.removeLoader(el); return; }
    if (!this.introPend) this.introPend = [];
    if (this.introPend.indexOf(el) === -1) this.introPend.push(el);
  };
  removeLoader = (el) => {
    const c = el.querySelector("canvas.loadcv");
    if (!c) return;
    c.style.opacity = "0";
    setTimeout(() => c.remove(), 600);
  };

  hideRectEls = () => { (this._rectEls || []).forEach((d) => { d.style.display = "none"; }); };
  rand = (a, b) => a + Math.random() * (b - a);
  generateRects = (n) => {
    const count = n ?? (this.state.navMode === "work" ? 5 : 4);
    const mk = (xr, yr, wr, hr) => ({
      x: this.rand(xr[0], xr[1]), y: this.rand(yr[0], yr[1]),
      w: this.rand(wr[0], wr[1]), h: this.rand(hr[0], hr[1]),
      ph: Math.random() * 6.28,
    });
    const zonesR = [
      [[0.00, 0.16], [0.02, 0.30]],
      [[0.30, 0.52], [0.24, 0.52]],
      [[0.58, 0.80], [0.04, 0.42]],
      [[0.10, 0.30], [0.50, 0.70]],
      [[0.64, 0.82], [0.52, 0.70]],
    ];
    const sz = count > 3 ? [[0.12, 0.20], [0.24, 0.42]] : [[0.15, 0.25], [0.30, 0.55]];
    this.rects = zonesR.slice(0, count).map((z) => mk(z[0], z[1], sz[0], sz[1])).map((r) => {
      if (r.x + r.w > 0.98) r.x = 0.98 - r.w;
      if (r.y + r.h > 0.96) r.y = 0.96 - r.h;
      if (r.x < 0.01) r.x = 0.01;
      if (r.y < 0.01) r.y = 0.01;
      return r;
    });
  };

  reveal = (v) => {
    if (this.overlay) this.overlay.style.opacity = v ? ".58" : ".28";
    if (v) this.generateRects();
    this.setState({ revealed: v, panel: v ? this.state.panel : null, navMode: v ? this.state.navMode : "main", cat: v ? this.state.cat : null });
  };
  openPanel = (p) => {
    const opening = this.state.panel !== p;
    this.setState({ panel: opening ? p : null }, () => { if (opening && p === "us") this.armTeam(); });
  };
  navLabels = (mode) => {
    const lang = this.state.lang;
    return mode === "work"
      ? (lang === "es"
        ? ["documental", "podcast", "videoclip", "fashion film"]
        : ["documentary", "podcast", "music video", "fashion film"])
      : ["work", "contact", "about", "us"];
  };
  // al abrir "us", cada foto vuelve a formarse con ruido y aparece con su línea
  armTeam = () => {
    (this.teamEls || []).forEach((el) => {
      if (!el || !el.isConnected) return;
      this.addLoader(el);
      setTimeout(() => this.revealTile(el), 120 + Math.random() * 420);
    });
  };
  teamRef = (i, src) => (el) => {
    if (!this.teamEls) this.teamEls = [];
    this.teamEls[i] = el;

      showFrames: projects[this.state.proj]?.cat !== "podcast" && !projects[this.state.proj]?.vid?.igPosts,
      curTitle: projects[this.state.proj]?.title || "",
      curSummary: projects[this.state.proj]?.summary || "",
      esClass: lang === "es" ? "on" : "",
      enClass: lang === "en" ? "on" : "",
      location: lang === "es" ? "Madrid · ubicación" : "Madrid · location",
      back: lang === "es" ? "volver" : "back",
      goBack: this.goBack,
      ytRef: this.ytRef,
      overlayRef: this.setOverlay,
      revealOn: this.revealOn,
      revealOff: this.revealOff,
      toggleSound: this.toggleSound,
      soundLabel: (this.state.muted
        ? (lang === "es" ? "sonido ✕" : "sound off")
        : (lang === "es" ? "sonido ●" : "sound on")),
      setEs: () => this.setState({ lang: "es" }),
      setEn: () => this.setState({ lang: "en" }),
      goHome: () => this.setState({ view: "home" }),
    };
  }
}
</script>
</body>
</html>
